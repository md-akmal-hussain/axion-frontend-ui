# ============================================================
# AXION UI - FRONTEND CI/CD PIPELINE
# Build Frontend -> Publish Artifact -> Deploy to Azure VM
# ============================================================

name: axion-ui-$(Date:yyyyMMdd).$(Rev:r)

# ============================================================
# TRIGGER
# ============================================================

trigger:
  branches:
    include:
      - main
      - develop

pr:
  branches:
    include:
      - main
      - develop


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Node / Frontend
  nodeVersion: '20.x'
  frontendFolder: '.'
  buildFolder: 'dist'

  # Artifact
  artifactName: 'axion-frontend-vm-01'

  # Azure VM
  frontendVmName: 'Exion-frontend-VM-01'

  # SSH Service Connection
  sshServiceConnection: 'ssh-svc'

  # Nginx
  nginxRoot: '/var/www/html'


# ============================================================
# STAGES
# ============================================================

stages:


# ============================================================
# STAGE 1 - BUILD FRONTEND
# ============================================================

- stage: Build_Frontend
  displayName: 'Build Frontend'

  jobs:

  - job: Build_Axion_UI
    displayName: 'Build Axion UI JOB'

    pool:
      name: 'Yaml_Pool'

    steps:

    # --------------------------------------------------------
    # 1. Checkout Source Code
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout axion-ui'


    # --------------------------------------------------------
    # 2. Install Node.js
    # --------------------------------------------------------

    - task: UseNode@1
      displayName: 'Install Node.js'
      inputs:
        version: '$(nodeVersion)'


    # --------------------------------------------------------
    # 3. NPM Install
    # --------------------------------------------------------

    - script: |
        echo ==========================================
        echo Installing Node dependencies
        echo ==========================================

        node --version
        npm --version

        npm install --include=dev --no-audit --no-fund

        echo.
        echo Installing TypeScript explicitly...
        npm install --save-dev typescript --no-audit --no-fund

        echo.
        echo Checking TypeScript...
        dir node_modules\typescript\bin
        dir node_modules\.bin

        node node_modules\typescript\bin\tsc --version

      displayName: 'NPM Install'
      workingDirectory: '$(frontendFolder)'


    # --------------------------------------------------------
    # 4. NPM Build
    # --------------------------------------------------------

    - task: Npm@1
      inputs:
        command: 'custom'
        customCommand: 'run build'


    # --------------------------------------------------------
    # 5. Verify Dist Folder
    # --------------------------------------------------------

    - powershell: |

        Write-Host "=========================================="
        Write-Host "Checking Frontend Build Output"
        Write-Host "=========================================="

        $distPath = "$(Build.SourcesDirectory)\$(buildFolder)"

        if (!(Test-Path $distPath)) {

            Write-Error "Build folder '$distPath' was not found."

            exit 1
        }

        Write-Host "Build folder found:"
        Write-Host $distPath

        Write-Host ""
        Write-Host "Build files:"

        Get-ChildItem $distPath -Recurse

      displayName: 'Verify Dist Folder'


    # --------------------------------------------------------
    # 6. Prepare Frontend Artifact
    # --------------------------------------------------------

    - task: CopyFiles@2
      displayName: 'Prepare Frontend Artifact'
      inputs:

        SourceFolder: '$(Build.SourcesDirectory)/$(buildFolder)'

        Contents: '**'

        TargetFolder: '$(Build.ArtifactStagingDirectory)/$(artifactName)'

        CleanTargetFolder: true


    # --------------------------------------------------------
    # 7. Publish Frontend Artifact
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Frontend Artifact'
      inputs:

        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'

        artifact: '$(artifactName)'


# ============================================================
# STAGE 2 - DEPLOY FRONTEND TO AZURE VM
# ============================================================

- stage: Deploy_Frontend
  displayName: 'Deploy Frontend to Azure VM'

  dependsOn:
    - Build_Frontend

  condition: succeeded()

  jobs:

  - job: Deploy_to_Ubuntu_VM
    displayName: 'Deploy to Ubuntu VM'

    pool:
      name: 'Yaml_Pool'

    steps:


    # --------------------------------------------------------
    # 1. No Source Checkout Required
    # --------------------------------------------------------

    - checkout: none
      displayName: 'Skip Source Checkout'


    # --------------------------------------------------------
    # 2. Download Frontend Artifact
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download Frontend Artifact'
      inputs:

        artifact: '$(artifactName)'

        path: '$(Pipeline.Workspace)/$(artifactName)'


    # --------------------------------------------------------
    # 3. Copy Frontend Artifact to Azure VM
    # --------------------------------------------------------

    - task: CopyFilesOverSSH@0
      displayName: 'Copy Frontend Artifact to VM'
      inputs:

        sshEndpoint: '$(sshServiceConnection)'

        sourceFolder: '$(Pipeline.Workspace)/$(artifactName)'

        contents: '**'

        targetFolder: '/tmp/axion-ui'

        readyTimeout: '20000'

        overwrite: true

        cleanTargetFolder: true

        failOnEmptySource: true


    # --------------------------------------------------------
    # 4. Deploy Frontend to Nginx
    # --------------------------------------------------------

    - task: SSH@0
      displayName: 'Deploy Frontend to Nginx'
      inputs:

        sshEndpoint: '$(sshServiceConnection)'

        runOptions: 'inline'

        inline: |

          set -e

          echo "=========================================="
          echo "Deploying Axion UI"
          echo "VM: $(frontendVmName)"
          echo "=========================================="


          echo "Checking uploaded files..."

          ls -la /tmp/axion-ui


          echo "Creating Nginx root directory..."

          sudo mkdir -p $(nginxRoot)


          echo "Creating backup directory..."

          sudo mkdir -p /var/backups/axion-ui


          echo "Backing up current frontend..."

          sudo rm -rf /var/backups/axion-ui/latest

          sudo cp -a $(nginxRoot) /var/backups/axion-ui/latest


          echo "Cleaning old frontend files..."

          sudo rm -rf $(nginxRoot)/*


          echo "Copying new frontend files..."

          sudo cp -a /tmp/axion-ui/. $(nginxRoot)/


          echo "Setting permissions..."

          sudo chown -R www-data:www-data $(nginxRoot)

          sudo chmod -R 755 $(nginxRoot)


          echo "Testing Nginx configuration..."

          sudo nginx -t


          echo "Reloading Nginx..."

          sudo systemctl reload nginx


          echo "Checking Nginx status..."

          sudo systemctl is-active nginx


          echo "=========================================="
          echo "Axion UI deployment completed successfully"
          echo "=========================================="


          echo "Cleaning temporary files..."

          sudo rm -rf /tmp/axion-ui

        readyTimeout: '20000'

        failOnStdErr: false